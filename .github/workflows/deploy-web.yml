name: Test and deploy web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: web-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the version marker
        run: |
          build="$(date -u +%Y.%m.%d) · ${GITHUB_SHA::7}"
          sed -i "s/BUILD_ID/${build}/" web/index.html
          grep -c "גרסת ממשק: ${build}" web/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
