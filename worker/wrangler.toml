name = "rivhit-telegram-transfer"
main = "src/index.js"
compatibility_date = "2026-09-04"

[[durable_objects.bindings]]
name = "UPLOAD_SESSION"
class_name = "UploadSession"

[[durable_objects.bindings]]
name = "DEVICE_REGISTRY"
class_name = "DeviceRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DeviceRegistry"]

[[r2_buckets]]
binding = "UPLOAD_PHOTOS"
bucket_name = "rivhit-temporary-photos"

# Comma-separated browser origins. Keep localhost for development and add the
# final GitHub Pages URL before deploying.
[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:8010,http://localhost:8010,https://vitaliksh.github.io"
BOT_USERNAME = "Vitalikshbot"
BACKEND_VERSION = "2026.10.13.1 · 18:00 IDT"
