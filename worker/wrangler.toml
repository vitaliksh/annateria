name = "annateria"
main = "src/index.js"
compatibility_date = "2026-09-04"

# Counts login attempts (src/auth-guard.js). SQLite-backed, so it also works on the Workers Free plan.
[[durable_objects.bindings]]
name = "AUTH_GUARD"
class_name = "AuthGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthGuard"]

# Worker secrets (never in this file): ACCESS_CODES, TOKEN_SIGNING_KEY. See README.md.

# Comma-separated browser origins. Keep localhost for development and add the
# final GitHub Pages URL before deploying.
[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:8010,http://localhost:8010,https://vitaliksh.github.io"
BACKEND_VERSION = "2026.10.16.2"
